<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Globe with location pins</title>
  <desc id="desc">A flat cartoon globe icon with two colorful location markers.</desc>

  <defs>
    <clipPath id="globeClip">
      <circle cx="128" cy="132" r="91"/>
    </clipPath>
  </defs>

  <!-- Globe -->
  <circle cx="128" cy="132" r="91" fill="#69C4EA" stroke="#000" stroke-width="10"/>

  <!-- Land masses -->
  <g clip-path="url(#globeClip)" fill="#A7DF67" stroke="#000" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M46 85c18-29 44-45 74-49 13-2 29-1 43 3-5 11-6 20-4 28 2 10 0 18-9 24-8 6-18 4-26-4-7-6-13-7-20-3-12 7-19 2-22-8-2-5-14-8-36-15z"/>
    <path d="M169 72c24 9 43 30 49 56 7 29-2 59-23 80-8 8-17 15-28 20-9-10-12-20-10-31 2-10 1-18-7-24-6-5-8-12-5-21 4-12 2-22-6-28-7-6-6-16 2-23 7-6 17-7 27-3 9 4 16 1 20-8 3-7 0-13-7-18-4-3-8-6-12-10z"/>
    <path d="M93 157c10 0 18 4 23 12 5 9 11 14 19 17 10 4 14 13 10 22-3 7-10 11-19 11-7 0-13 4-16 11-4 8-11 14-20 17-19-8-34-21-44-38 10-8 15-18 16-30 1-14 12-22 31-22z"/>
  </g>

  <!-- Pin 1 -->
  <g transform="translate(157 20)">
    <path d="M35 4c-22 0-40 18-40 40 0 27 40 70 40 70s40-43 40-70C75 22 57 4 35 4z" fill="#FF5B61" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="35" cy="44" r="15" fill="#fff" stroke="#000" stroke-width="9"/>
  </g>

  <!-- Pin 2 -->
  <g transform="translate(27 105)">
    <path d="M35 4c-22 0-40 18-40 40 0 27 40 70 40 70s40-43 40-70C75 22 57 4 35 4z" fill="#F9BD4E" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="35" cy="44" r="15" fill="#fff" stroke="#000" stroke-width="9"/>
  </g>
</svg>
